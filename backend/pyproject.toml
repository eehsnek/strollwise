[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501", # handled by formatter
    "UP007", # allow X | Y and Optional[X] interchangeably
]

[tool.ruff.lint.per-file-ignores]
"seed.py" = ["E402"]
"tests/conftest.py" = ["E402"]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
